[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "brief-intake"
version = "0.1.0"
description = "Первичный разбор заявок на автоматизацию"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "SergeyLT"}]
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "openai>=2.11,<3",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.12,<1", "mypy>=1.17,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".pytest_cache"
addopts = "--basetemp=.tmp/pytest"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tmp", ".venv", "ignore", "output"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
pretty = false
show_error_codes = true
